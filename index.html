<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>fischerf</title>
        <style>
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #09090b;
                color: #a1a1aa;
                font-family:
                    ui-monospace, "JetBrains Mono", "Fira Code", monospace;
                font-size: 1rem;
            }
            a {
                color: #e4e4e7;
                text-decoration: none;
                border-bottom: 1px solid #3f3f46;
                padding-bottom: 1px;
                transition:
                    color 0.2s,
                    border-color 0.2s;
            }
            a:hover {
                color: #ffffff;
                border-color: #a1a1aa;
            }
            .card {
                text-align: center;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }
            .name {
                font-size: 1.5rem;
                font-weight: 600;
                color: #e4e4e7;
                letter-spacing: 0.05em;
            }
            .links {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="name">fischerf</div>
            <div class="links">
                <div>
                    <a
                        href="https://github.com/fischerf"
                        target="_blank"
                        rel="noopener"
                        >github.com/fischerf</a
                    >
                </div>
                <div>
                    <a href="/aar/"
                        >aar &mdash; adaptive action &amp; reasoning</a
                    >
                </div>
            </div>
        </div>
    </body>
</html>
